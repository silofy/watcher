[package]
name = "watcher-capture"
version = "0.1.0"
edition = "2021"
description = "The Watcher — cross-platform PTY capture proof-of-concept (ConPTY on Windows, openpty on Unix)"

[[bin]]
name = "watcher-capture"
path = "src/main.rs"

[dependencies]
# Shared session controller + re-redaction.
watcher-core = { path = "../core" }
# One PTY abstraction over Windows ConPTY and Unix openpty/forkpty (the WezTerm crate).
portable-pty = "0.8"
# Userspace VT parser — strips control sequences to clean text (brief §3.1 uses vte).
vte = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# raw-mode stdin + terminal size for live interactive capture (cross-platform).
crossterm = "0.28"
# ISO-8601 timestamps for the exported session report (no system-tz needed beyond UTC clock).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
