name: CI

# Gate for every PR and push to main: the web app (typecheck + vitest) and the Rust capture-side
# crates. src-tauri isn't tested here — it needs the full desktop toolchain; release.yml builds it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  rust:
    # Linux (openpty) and Windows (ConPTY) take different PTY paths in the capture agent.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/core
            crates/capture
            crates/store
            crates/daemon
      - name: cargo test
        shell: bash
        run: |
          for c in core capture store daemon; do
            echo "::group::crates/$c"
            cargo test --locked --manifest-path "crates/$c/Cargo.toml"
            echo "::endgroup::"
          done
