[package]
name = "watcher-daemon"
version = "0.1.0"
edition = "2021"
description = "The Watcher daemon — merges telemetry sources, re-redacts, owns session boundaries, persists to SQLCipher"

[[bin]]
name = "watcher-daemon"
path = "src/main.rs"

[lib]
name = "watcher_daemon"
path = "src/lib.rs"

[dependencies]
watcher-core = { path = "../core" }
watcher-store = { path = "../store" }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
