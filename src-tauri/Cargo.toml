[package]
name = "watcher"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "The Watcher — local-first flight data recorder for ethical hackers"
authors = ["The Watcher"]
edition = "2021"
rust-version = "1.77.2"

# The library is shared between the desktop binary and (future) mobile targets.
[lib]
name = "watcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# server-side write-up fetch (no browser CORS). native-tls uses Windows SChannel — no OpenSSL build.
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"
# extract the text layer from HTB's official write-up PDFs (pure Rust, no system deps)
pdf-extract = "0.7"

[features]
# this feature is used for production builds or when a dev server is not specified
custom-protocol = ["tauri/custom-protocol"]
