[package]
name = "watcher"
version = "0.1.0"
description = "The Watcher — local-first flight data recorder for ethical hackers"
authors = ["The Watcher"]
edition = "2021"
rust-version = "1.77.2"

# The library is shared between the desktop binary and (future) mobile targets.
[lib]
name = "watcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# this feature is used for production builds or when a dev server is not specified
custom-protocol = ["tauri/custom-protocol"]
